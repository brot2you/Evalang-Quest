<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d83b53"><meta name="description" content="Ev@lang Quest — an independent, playful English practice adventure for Year 9 students. Train, learn from mistakes and explore your CEFR progress."><title>Ev@lang Quest | Your English Adventure</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
:root{font-family:Nunito,system-ui,sans-serif;color:#eef2ff;background:#121a31}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 10% 0%,#334477 0,transparent 39%),radial-gradient(ellipse at 90% 20%,#533e80 0,transparent 30%),#121a31}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffe18a;outline-offset:3px}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:12px;flex-wrap:wrap}.brand{font-size:1.25rem;font-weight:900;letter-spacing:.3px}.brand em{color:#ffdc86;font-style:normal}.chip{background:#293452;border:1px solid #52618b;border-radius:999px;padding:8px 14px;font-weight:800;color:#fff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button,.btn{border:1px solid #566b99;border-radius:14px;background:#253555;color:#f4f6ff;padding:10px 15px;font-weight:900}.nav button.on{background:#e9c970;color:#22294b;border-color:#e9c970}.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:22px;background:linear-gradient(115deg,#343d78,#493780 64%,#292e5e);border:1px solid #6e72a8;border-radius:25px;padding:33px;box-shadow:0 14px 44px #080d2144;position:relative;overflow:hidden}.hero:after{content:'✦  ✧  ✦';position:absolute;right:4%;top:12%;font-size:3rem;color:#ffe09d33;transform:rotate(-18deg);pointer-events:none}.eyebrow{font-size:.79rem;font-weight:900;letter-spacing:2px;color:#f8d97e;text-transform:uppercase}h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.08;margin:12px 0}h2{font-size:1.5rem;margin:0 0 14px}h3{margin:0 0 8px;font-size:1.16rem}p{line-height:1.55;color:#d0d9f1}.hero p{max-width:570px}.btn.primary{background:linear-gradient(90deg,#ffdc80,#ffc476);border:0;color:#26304a}.btn:hover,.nav button:hover,.choice:hover{filter:brightness(1.1)}.hero-art{display:grid;place-items:center;font-size:clamp(6rem,13vw,10rem);filter:drop-shadow(0 15px 12px #09132a66)}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat{background:#101b3a7d;border:1px solid #8793bc66;border-radius:14px;padding:10px 15px}.stat b{display:block;font-size:1.25rem;color:#ffdb83}.stat small{color:#d3d9eb}.section{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#212b49e8;border:1px solid #41537c;border-radius:20px;padding:22px;box-shadow:0 12px 25px #070b1928}.card{min-height:234px;display:flex;flex-direction:column;transition:transform .2s}.card:hover{transform:translateY(-4px)}.orb{font-size:3.2rem;padding-bottom:12px}.sub{font-size:.9rem;color:#bac8e7}.level{margin-top:auto;color:#ffe08a;font-size:.85rem;font-weight:900}.card .btn{margin-top:12px}.lower{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.progress{height:10px;border-radius:20px;background:#3a486a;overflow:hidden;margin:9px 0 16px}.fill{height:100%;border-radius:20px;background:linear-gradient(90deg,#59d6c7,#a1f0bc);width:0}.skillrow{display:flex;align-items:center;justify-content:space-between;gap:5px}.skillrow b{font-size:.94rem}.small{font-size:.83rem;color:#aebdde}.pill{display:inline-flex;border-radius:999px;padding:5px 10px;background:#3b4b72;font-size:.78rem;font-weight:900}.badges{display:flex;gap:12px;flex-wrap:wrap}.badgeitem{background:#384362;border:1px solid #637295;padding:11px;border-radius:14px;min-width:85px;text-align:center;font-size:.82rem}.badgeitem span{display:block;font-size:1.8rem}.locked{opacity:.38;filter:grayscale(1)}.questionbox{max-width:760px;margin:24px auto}.choice{display:block;width:100%;padding:16px 18px;text-align:left;background:#303f63;color:#f8faff;border:1px solid #6579a5;border-radius:13px;margin:10px 0;font-weight:800;transition:.15s}.choice:disabled{cursor:default}.choice.correct{background:#1d665d;border-color:#74dac3}.choice.wrong{background:#713e52;border-color:#f4a2ad}.qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.passage{white-space:pre-line;background:#17233f;border:1px solid #465b86;border-radius:16px;padding:21px;margin:17px 0;color:#e3edff;line-height:1.7}.answer{padding:15px;border-radius:14px;background:#263857;margin-top:14px}.hidden{display:none!important}.footer{font-size:.8rem;color:#96a5c6;text-align:center;padding:40px 10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}#nameInput{background:#14203c;color:white;border:1px solid #6476a8;padding:10px;border-radius:10px;width:min(260px,100%)}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.hero-art{display:none}.lower{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.hero{padding:23px}.card{min-height:auto}.top{align-items:flex-start}.questionbox{margin:14px auto}}

/* Cozy Quest V2: warm illustrated-world-inspired palette and accessible review cards */
:root{color:#283b48;background:#ecf4ed}body{background:radial-gradient(circle at 10% 2%,#fff1d9 0,transparent 31%),radial-gradient(circle at 88% 15%,#d6f0e5 0,transparent 36%),#edf4e9;color:#283b48}.brand{color:#344d49}.brand em{color:#347963}.chip,.pill{background:#e1f0e5;color:#345b52;border:1px solid #b5d6c4}.nav button,.btn{background:#fffdf7;color:#31574f;border:1px solid #bdd8c8;box-shadow:0 3px 0 #b8d3c2}.nav button.on,.btn.primary{background:#f4c56c;color:#4a4736;border-color:#e4ab50;box-shadow:0 3px 0 #dba75b}.hero,.journal-hero{background:linear-gradient(112deg,#cae9d7,#e8f5e3 52%,#f9ecd0);border:2px solid #b5d7bc;box-shadow:0 12px 32px #78958022;color:#254e47}.hero p,.journal-hero p{color:#54736e}.hero:after{color:#d3a04e88}.eyebrow,.level{color:#55806c}.stat{background:#ffffffb8;border-color:#c8dcc9}.stat b{color:#397e68}.stat small{color:#54736e}.card,.panel,.journal-banner{background:#fffdf8;border:1px solid #d5e1d1;box-shadow:0 9px 25px #7b9c8a21}.sub,.small,p{color:#62766c}.badgeitem{background:#ecf5e8;border-color:#cbdcc7}.progress{background:#dce9df}.passage{background:#f3f8f0;color:#344e48;border-color:#ceddcc}.choice{background:#f6faf2;color:#31544d;border-color:#cadfcd}.choice.correct{background:#cfefe0;color:#225b48;border-color:#69b996}.choice.wrong{background:#fce1dd;color:#773e3d;border-color:#e8a5a0}.answer{background:#edf7e9;color:#344e48}.footer{color:#5c746c}.journal-banner,.journal-hero{display:flex;align-items:center;justify-content:space-between;gap:24px;border-radius:24px;padding:30px}.journal-mascot{font-size:5rem}.review-list{display:grid;gap:12px}.review-item{padding:14px;border-radius:16px;background:#f2f8f0;display:flex;align-items:center;justify-content:space-between;gap:16px;border:1px solid #d8e6d5}.review-item .small{margin-top:5px}.lesson-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.toolkit{background:#f4f9f1;border:1px solid #d4e2d1;border-radius:18px;padding:18px}.toolkit .orb{font-size:2.2rem}.lesson-page{max-width:780px;margin:25px auto}.lesson-tip{display:flex;gap:20px;background:#e5f3e7;border:1px solid #c3ddcb;border-radius:20px;padding:20px;margin:22px 0}.tip-avatar{font-size:3.3rem}.emptyjournal{text-align:center;padding:32px}.emptyjournal:first-letter{font-size:2rem}#nameInput{background:#fff;color:#254e47;border-color:#b0d1bd}@media(max-width:650px){.journal-banner,.journal-hero{align-items:flex-start}.journal-mascot{display:none}.lesson-grid{grid-template-columns:1fr}.review-item{flex-direction:column;align-items:stretch}}
</style><link rel="stylesheet" href="cozy.css"><link rel="stylesheet" href="arcade.css"></head><body><div class="wrap"><header class="top"><div class="brand" aria-label="Ev@lang Quest"><span class="brand-spark" aria-hidden="true">✦</span><span class="brand-word">Ev<span class="brand-at">@</span>lang <em>Quest</em></span><span class="brand-tagline">Your English Adventure</span></div><div class="nav"><button class="on" data-page="home">🏡 Home</button><button data-page="passport">🧭 Passport</button><button data-page="rewards">🏅 Rewards</button><button data-page="journal">📔 My Journal</button></div></header><main id="app"></main><div class="footer">Ev@lang Quest is an independent practice game, not affiliated with the official Ev@lang assessment. Progress is saved on this device.</div></div>
<script>
'use strict';
const TYPES={listening:{title:'Listening Island',emoji:'🎧',detail:'Listen, understand and identify the key message.',color:'#72cef3'},reading:{title:'Reading Kingdom',emoji:'📚',detail:'Explore messages, articles and stories.',color:'#79dcc4'},grammar:{title:'Grammar Academy',emoji:'✨',detail:'Decode language patterns and structures.',color:'#c6a4ff'},vocabulary:{title:'Vocabulary Valley',emoji:'💎',detail:'Grow your vocabulary in context.',color:'#ffca7f'}};
const LEVELS=['A1','A1+','A2','A2+','B1','B1+'];
// All texts and questions below are original practice content, not official test items.
const bank=[
{d:'listening',l:0,t:'Hi, I am Josh. I am thirteen and I live in Bristol.',q:'How old is Josh?',o:['Thirteen','Thirty','Sixteen'],a:0,e:'“Thirteen” gives his age.'},
{d:'listening',l:1,t:'Attention, passengers. The bus to Oxford leaves from stop six in five minutes.',q:'Where should passengers go?',o:['Stop five','Stop six','Platform sixteen'],a:1,e:'The announcement says “stop six”.'},
{d:'listening',l:2,t:'Hey, Mia. I can’t meet you on Saturday because I’m visiting my grandparents. What about Sunday afternoon?',q:'When does the speaker suggest meeting?',o:['Saturday morning','Sunday afternoon','Sunday evening'],a:1,e:'Sunday afternoon is offered as an alternative.'},
{d:'listening',l:2,t:'The museum opens at nine thirty, but our tour starts at ten. Please arrive fifteen minutes before the tour.',q:'What time should the group arrive?',o:['9:30','9:45','10:15'],a:1,e:'Fifteen minutes before ten is 9:45.'},
{d:'listening',l:3,t:'I expected the concert to be noisy and crowded. Surprisingly, the atmosphere was relaxed, even though the band played energetic songs.',q:'What surprised the speaker?',o:['The quiet atmosphere','The late arrival','The slow music'],a:0,e:'“Surprisingly” introduces the unexpected relaxed atmosphere.'},
{d:'listening',l:4,t:'Although the new cycle lanes have reduced traffic, several residents argue that the city should prioritise reliable public transport instead.',q:'What is the residents’ main argument?',o:['Remove all cycle lanes','Invest more in public transport','Increase car parking'],a:1,e:'The contrast points to a preference for better public transport.'},
{d:'listening',l:5,t:'The speaker admits that the plan looks affordable initially, yet warns that maintenance costs are likely to outweigh any short-term savings.',q:'What is the speaker’s reservation?',o:['Upfront cost','Long-term expense','Lack of staff'],a:1,e:'Maintenance costs may exceed short-term savings.'},
{d:'reading',l:0,t:'Hi! My name is Sam. I play football every Wednesday after school.',q:'When does Sam play football?',o:['Monday','Wednesday','Friday'],a:1,e:'The day is explicitly stated.'},
{d:'reading',l:1,t:'LIBRARY NOTICE\nThe library is closed on Monday. Please return books on Tuesday or later.',q:'When can you return books?',o:['Monday','Tuesday','Sunday'],a:1,e:'The notice says Tuesday or later.'},
{d:'reading',l:2,t:'From: Ella\nHi Ben, I’ll be ten minutes late because my train has been delayed. Could you wait near the main entrance rather than inside the café? Thanks!',q:'Where should Ben wait?',o:['Inside the café','Near the main entrance','At the train station'],a:1,e:'Ella explicitly asks him to wait near the entrance.'},
{d:'reading',l:3,t:'Our school garden used to be an empty parking space. Thanks to volunteers, it is now a lively place where students can grow vegetables and learn about biodiversity.',q:'What has changed?',o:['A parking area became a garden','The school built a new car park','The garden was closed'],a:0,e:'The place was transformed into a school garden.'},
{d:'reading',l:4,t:'While some people welcome remote learning for its flexibility, critics emphasise that students without reliable internet connections risk being left behind.',q:'What concern do critics express?',o:['More commuting','Unequal access','Fewer school holidays'],a:1,e:'Unequal internet access can disadvantage students.'},
{d:'reading',l:5,t:'Rather than dismissing the proposal entirely, the committee recommended a limited trial, provided that its environmental impact could be assessed independently.',q:'Under what condition would a trial proceed?',o:['With independent environmental assessment','If it is made permanent','Only without public feedback'],a:0,e:'“Provided that” introduces the necessary condition.'},
{d:'grammar',l:0,t:'Choose the correct sentence.',q:'Which sentence is correct?',o:['She have a dog.','She has a dog.','She having a dog.'],a:1,e:'Use “has” with she/he/it in the present simple.'},
{d:'grammar',l:1,t:'Complete the sentence.',q:'There ___ two books on the table.',o:['is','are','be'],a:1,e:'“Two books” is plural, so use “are”.'},
{d:'grammar',l:2,t:'Choose the correct form.',q:'I ___ my homework when the phone rang.',o:['did','was doing','have done'],a:1,e:'The past continuous describes an action in progress.'},
{d:'grammar',l:3,t:'Complete the sentence.',q:'If it rains tomorrow, we ___ at home.',o:['stay','stayed','will stay'],a:2,e:'First conditional: if + present, will + verb.'},
{d:'grammar',l:4,t:'Choose the correct relative pronoun.',q:'That is the scientist ___ discovered the new material.',o:['whose','who','where'],a:1,e:'“Who” refers to the person performing the action.'},
{d:'grammar',l:5,t:'Choose the most natural completion.',q:'Hardly ___ the meeting started when the lights went out.',o:['had','has','did'],a:0,e:'Negative adverbial inversion: “Hardly had … when …”.'},
{d:'vocabulary',l:0,t:'Choose the best meaning.',q:'What is “huge”?',o:['Very small','Very big','Very slow'],a:1,e:'“Huge” means very big.'},
{d:'vocabulary',l:1,t:'Choose the best word.',q:'It is raining. Take your ___.',o:['umbrella','sunglasses','sandals'],a:0,e:'An umbrella helps when it rains.'},
{d:'vocabulary',l:2,t:'Choose the best meaning.',q:'What does “borrow” mean?',o:['Give permanently','Take and return later','Buy with cash'],a:1,e:'To borrow is to use something temporarily and return it.'},
{d:'vocabulary',l:3,t:'Choose the best expression.',q:'She was ___ by the unexpected news.',o:['taken aback','taken over','taken off'],a:0,e:'“Taken aback” means surprised.'},
{d:'vocabulary',l:4,t:'Choose the closest meaning.',q:'“The findings were inconclusive.”',o:['The results were uncertain','The results were excellent','The results were hidden'],a:0,e:'Inconclusive means not establishing a clear conclusion.'},
{d:'vocabulary',l:5,t:'Choose the closest meaning.',q:'“The policy may exacerbate existing inequalities.”',o:['Make them worse','Remove them entirely','Measure them carefully'],a:0,e:'Exacerbate means make a problem worse.'},
];
const KEY='english-quest-cefr-v1';const fresh=()=>({name:'Explorer',xp:0,coins:0,answers:0,correct:0,history:[],skills:Object.fromEntries(Object.keys(TYPES).map(k=>[k,{rating:2,attempts:0,correct:0,levels:[]}]))});
let state;try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));if(!state.skills||Object.keys(TYPES).some(k=>!state.skills[k]))state=fresh()}catch{state=fresh()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};state.journal=state.journal||{};let page='home',session=null;
const el=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let scoreLevel=k=>{let s=state.skills[k];if(s.attempts<3)return '—';return LEVELS[Math.max(0,Math.min(5,Math.round(s.rating)))];};
let globalLevel=()=>{if(Object.values(state.skills).some(x=>x.attempts<3))return 'To explore';return LEVELS[Math.max(0,Math.min(5,Math.round(Object.values(state.skills).reduce((n,s)=>n+s.rating,0)/4)))];};
const completed=()=>Object.values(state.skills).filter(s=>s.attempts>=3).length;
const achievements=[['🌱','First Steps',state.answers>=1],['🧭','Explorer',completed()===4],['🔥','On a Roll',state.answers>=12],['🏅','Practice Pro',state.answers>=30],['💠','Word Master',state.skills.vocabulary.attempts>=8],['🎧','Sound Hunter',state.skills.listening.attempts>=8]];
function mount(html){el.innerHTML=html}
function nav(p){page=p;session=null;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x.dataset.page===p));render();}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function home(){mount(`<section class="hero"><div><div class="eyebrow">Your English adventure starts here</div><h1>Unlock your <span style="color:#ffdc86">English power!</span></h1><p>Explore four worlds, complete bite-sized missions and track your estimated CEFR progress from A1 to B1+.</p><button class="btn primary" id="diagnostic">🚀 Start my quest</button><div class="stats"><div class="stat"><b>${state.xp} XP</b><small>Experience</small></div><div class="stat"><b>🪙 ${state.coins}</b><small>Quest coins</small></div><div class="stat"><b>${globalLevel()}</b><small>Estimated CEFR</small></div></div></div><div class="hero-art" aria-hidden="true">🧑‍🚀</div></section><section class="section"><h2>Choose your world</h2><div class="grid">${Object.entries(TYPES).map(([k,v])=>`<div class="card"><div class="orb">${v.emoji}</div><h3>${v.title}</h3><div class="sub">${v.detail}</div><div class="level">Estimated: ${scoreLevel(k)}</div><button class="btn" data-train="${k}">Explore →</button></div>`).join('')}</div></section><section class="section lower"><div class="panel"><h2>🧭 Your CEFR passport</h2>${skillsHTML()}<button class="btn" data-go="passport">Open passport →</button></div><div class="panel"><h2>🏆 Reward cabinet</h2><div class="badges">${achievements.slice(0,4).map(([e,n,on])=>`<div class="badgeitem ${on?'':'locked'}"><span>${e}</span>${n}</div>`).join('')}</div><p>Earn badges by exploring and practising. No penalties for trying again.</p><button class="btn" data-go="rewards">See rewards →</button></div></section><section class="section journal-banner"><div><div class="eyebrow">Grow with every try</div><h2>📔 My Learning Journal</h2><p>Turn mistakes into skills. Learn, practise, and revisit your discoveries.</p></div><button class="btn primary" data-go="journal">Open my journal →</button></section>`);document.getElementById('diagnostic').onclick=()=>start('mixed');document.querySelectorAll('[data-train]').forEach(b=>b.onclick=()=>start(b.dataset.train));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>nav(b.dataset.go))}
function skillsHTML(){return Object.entries(TYPES).map(([k,v])=>{const s=state.skills[k],n=Math.min(100,Math.round(s.attempts/10*100));return `<div class="skillrow"><b>${v.emoji} ${v.title}</b><span class="pill">${scoreLevel(k)}</span></div><div class="progress"><div class="fill" style="width:${n}%;background:${v.color}"></div></div>`}).join('')}
function passport(){mount(`<div class="panel"><div class="eyebrow">My English passport</div><h1>${esc(state.name)}</h1><p>Change your explorer nickname (stored only on this device).</p><input aria-label="Explorer nickname" maxlength="24" id="nameInput" value="${esc(state.name)}"> <button class="btn primary" id="saveName">Save name</button><div class="stats"><div class="stat"><b>${globalLevel()}</b><small>Indicative overall CEFR level</small></div><div class="stat"><b>${state.answers}</b><small>Questions attempted</small></div><div class="stat"><b>${state.correct}</b><small>Correct answers</small></div></div><h2 class="section">Skill progress</h2>${skillsHTML()}<p class="small">Estimated levels require at least three responses in each domain. The bars show practice volume, not CEFR proficiency. This small question bank is a demonstration, not a validated placement instrument. Repeated questions can affect estimates.</p><div class="actions"><button class="btn primary" id="resume">Continue training</button><button class="btn" id="reset">Reset local progress</button></div></div>`);document.getElementById('saveName').onclick=()=>{state.name=document.getElementById('nameInput').value.trim().slice(0,24)||'Explorer';save();passport()};document.getElementById('resume').onclick=()=>start('mixed');document.getElementById('reset').onclick=()=>{if(confirm('Delete this device’s saved practice progress?')){state=fresh();save();passport()}}}
function rewards(){mount(`<div class="panel"><div class="eyebrow">Collect and grow</div><h1>🏅 Your achievements</h1><p>Build confidence by collecting badges and earning quest coins.</p><div class="grid">${achievements.map(([emoji,name,ok])=>`<div class="card" style="min-height:160px;text-align:center;align-items:center;justify-content:center;${ok?'':'opacity:.45;filter:grayscale(1)'}"><div class="orb">${emoji}</div><h3>${name}</h3><span class="pill">${ok?'Unlocked':'Locked'}</span></div>`).join('')}</div><div class="stats"><div class="stat"><b>🪙 ${state.coins}</b><small>Quest coins</small></div><div class="stat"><b>${state.xp} XP</b><small>Total experience</small></div></div></div>`)}
function start(mode){session={mode,step:0,max:mode==='mixed'?12:6,seen:[],done:false};nextQuestion()}
function pick(){const d=session.mode==='mixed'?Object.keys(TYPES)[session.step%4]:session.mode;const s=state.skills[d];let target=Math.max(0,Math.min(5,Math.round(s.rating)));let pool=bank.filter(q=>q.d===d&&!session.seen.includes(bank.indexOf(q)));if(!pool.length)pool=bank.filter(q=>q.d===d);pool.sort((a,b)=>Math.abs(a.l-target)-Math.abs(b.l-target));const closest=pool.filter(q=>Math.abs(q.l-target)===Math.abs(pool[0].l-target));const q=closest[Math.floor(Math.random()*closest.length)];session.seen.push(bank.indexOf(q));return q}
function nextQuestion(){if(!session||session.step>=session.max){endSession();return}session.q=pick();const q=session.q;mount(`<div class="questionbox panel"><div class="qtop"><span class="pill">${TYPES[q.d].emoji} ${TYPES[q.d].title}</span><span class="pill">Mission ${session.step+1} / ${session.max}</span></div><div class="progress"><div class="fill" style="width:${(session.step/session.max)*100}%"></div></div><div class="eyebrow">${session.mode==='mixed'?'Explorer diagnostic':'Training mission'} · CEFR ${LEVELS[q.l]}</div><h2 style="margin-top:13px">${esc(q.q)}</h2>${q.d==='listening'?`<div class="passage"><p>🔊 Listen to the audio and choose your answer.</p><button class="btn primary" id="playAudio">▶ Play / replay</button><p class="small">This demo uses your device’s English speech synthesizer. Audio availability varies by device.</p></div>`:`<div class="passage">${esc(q.t)}</div>`}<div id="options">${q.o.map((o,i)=>`<button class="choice" data-answer="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="actions"><button class="btn hidden" id="next">Next mission →</button><button class="btn" id="exit">Exit</button></div></div>`);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(Number(b.dataset.answer)));document.getElementById('next').onclick=()=>nextQuestion();document.getElementById('exit').onclick=()=>nav('home');if(q.d==='listening')document.getElementById('playAudio').onclick=()=>{if(!('speechSynthesis' in window)){alert('Speech synthesis is not supported in this browser.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}}
function answer(chosen){const q=session.q,ok=chosen===q.a;document.querySelectorAll('[data-answer]').forEach(b=>{b.disabled=true;if(Number(b.dataset.answer)===q.a)b.classList.add('correct');else if(Number(b.dataset.answer)===chosen)b.classList.add('wrong')});const s=state.skills[q.d];s.attempts++;if(ok)s.correct++; // Small, transparent adaptive heuristic for demo only (not a psychometric CEFR estimator).
const expected=1/(1+Math.exp((q.l-s.rating)*1.15));s.rating=Math.max(0,Math.min(5,s.rating+((ok?1:0)-expected)*.48));state.answers++;if(ok)state.correct++;state.xp+=ok?20:8;state.coins+=ok?5:2;state.history.push({d:q.d,l:q.l,ok,at:Date.now()});if(!ok)recordMistake(q);state.history=state.history.slice(-400);save();session.step++;document.getElementById('feedback').innerHTML=`<div class="answer"><strong>${ok?'✅ Great thinking! +20 XP':'💡 Keep exploring! +8 XP'}</strong><p>${esc(q.e)}</p>${ok?'':`<p>📔 Saved to My Learning Journal — your next practice mission is ready.</p><button class="btn" id="learnNow">Learn and try again →</button>`}</div>`;if(!ok)document.getElementById('learnNow').onclick=()=>{session=null;openLesson(String(bank.indexOf(q)),true)};document.getElementById('next').classList.remove('hidden')}
function endSession(){const mode=session.mode;session=null;mount(`<div class="panel" style="max-width:740px;margin:24px auto;text-align:center"><div style="font-size:5rem">🎉</div><div class="eyebrow">Mission complete</div><h1>Great work, ${esc(state.name)}!</h1><p>You have completed a ${mode==='mixed'?'mixed diagnostic':'focused'} practice run. Try new missions to strengthen each skill.</p><div class="stats" style="justify-content:center"><div class="stat"><b>${globalLevel()}</b><small>Indicative level</small></div><div class="stat"><b>${state.xp}</b><small>Total XP</small></div></div><p class="small">This is an independent practice tool; it does not predict an official Ev@lang result.</p><div class="actions" style="justify-content:center"><button class="btn primary" id="again">Play again</button><button class="btn" id="viewPassport">View passport</button></div></div>`);document.getElementById('again').onclick=()=>start(mode);document.getElementById('viewPassport').onclick=()=>nav('passport')}

// My Learning Journal: separate retrieval-practice data, never used as an official CEFR estimate.
const DAY=86400000, SPACING=[1,3,7,14];
const lessons={
 grammar:{title:'Notice the pattern',rule:'Look at the subject and the time marker. Identify the structure before choosing the verb.',example:'She plays tennis every Friday. Yesterday she played basketball.',prompt:'My sister ___ to school every day.',options:['walk','walks','walking'],correct:1,why:'My sister = she; add -s to the verb in the present simple.'},
 vocabulary:{title:'Read the context',rule:'Use the words around an unfamiliar expression to work out its meaning. Check whether it fits the whole sentence.',example:'The train was delayed, so we arrived late.',prompt:'The train was delayed. It was ___ .',options:['late','early','empty'],correct:0,why:'Delayed means later than planned.'},
 reading:{title:'Find the evidence',rule:'Return to the text. Underline the exact word or expression that proves your answer. Beware of options that sound plausible but are not stated.',example:'“Please arrive before nine” means you must be there earlier than 9:00.',prompt:'Notice: “The library is closed on Mondays.” When can you NOT visit?',options:['Monday','Tuesday','Wednesday'],correct:0,why:'The word “closed” and the day “Mondays” provide the evidence.'},
 listening:{title:'Listen for clues',rule:'Listen once for the general idea, then replay for key information. Pay special attention to times, numbers, changes and contrasts.',example:'“Not Tuesday — Thursday” means Thursday is the corrected day.',prompt:'You hear: “Meet me at four, not five.” What time is the meeting?',options:['At five','At four','At six'],correct:1,why:'The speaker corrects five to four.'}
};
function recordMistake(q){const id=String(bank.indexOf(q)),old=state.journal[id];if(!old){state.journal[id]={id,domain:q.d,l:q.l,errors:1,stage:0,due:Date.now(),last:Date.now(),mastered:false};}else{old.errors++;old.stage=0;old.due=Date.now();old.last=Date.now();old.mastered=false;}}
function dueLessons(){return Object.values(state.journal).filter(x=>!x.mastered&&x.due<=Date.now()).sort((a,b)=>a.due-b.due)}
function fmtDate(t){return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function journal(){const arr=Object.values(state.journal).sort((a,b)=>a.due-b.due),due=dueLessons(),done=arr.filter(x=>x.mastered).length;mount(`<section class="journal-hero"><div><div class="eyebrow">Your cozy learning corner</div><h1>📔 My Learning Journal</h1><p>A mistake is a clue. Explore it, try a new example, and come back when your memory is ready.</p><div class="stats"><div class="stat"><b>${due.length}</b><small>Ready to practise</small></div><div class="stat"><b>${arr.length-done}</b><small>Learning</small></div><div class="stat"><b>${done}</b><small>Consolidated</small></div></div></div><div class="journal-mascot" aria-hidden="true">🦉📖</div></section><section class="section panel"><h2>🌿 Review garden</h2><p class="sub">Return after 1, 3, 7 and 14 days. You can practise whenever you like; a spaced-review step only counts when it is due.</p>${arr.length?`<div class="review-list">${arr.map(r=>{const q=bank[Number(r.id)],l=lessons[r.domain],label=r.mastered?'🌟 Consolidated':r.due<=Date.now()?'🔔 Ready to review':'🕰 Next review '+fmtDate(r.due);return `<div class="review-item"><div><strong>${TYPES[r.domain].emoji} ${esc(l.title)}</strong><div class="small">${esc(q.q)} · CEFR ${LEVELS[r.l]} · ${r.errors} mistake${r.errors===1?'':'s'}</div><div class="small">${label} · Stage ${Math.min(r.stage,4)}/4</div></div><button class="btn" data-lesson="${r.id}">${r.mastered?'Practice again':'Review →'}</button></div>`}).join('')}</div>`:`<div class="emptyjournal">🌱<h3>Your garden is ready!</h3><p>Missed answers from your missions will appear here with short lessons and personalised reviews.</p><button class="btn primary" id="startJournalMission">Start a mission →</button></div>`}</section><section class="section panel"><h2>🧠 My learning toolkit</h2><div class="lesson-grid">${Object.entries(lessons).map(([d,l])=>`<div class="toolkit"><div class="orb">${TYPES[d].emoji}</div><h3>${esc(l.title)}</h3><p>${esc(l.rule)}</p><button class="btn" data-demo="${d}">Try example →</button></div>`).join('')}</div></section>`);document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson,false));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>openLesson('demo:'+b.dataset.demo,false));document.getElementById('startJournalMission')?.addEventListener('click',()=>start('mixed'))}
function openLesson(id,immediate){const demo=id.startsWith('demo:'),rec=demo?null:state.journal[id];if(!demo&&!rec){journal();return}const domain=demo?id.slice(5):rec.domain,l=lessons[domain],q=demo?null:bank[Number(id)];mount(`<section class="lesson-page panel"><div class="eyebrow">${TYPES[domain].emoji} ${TYPES[domain].title} · Learning mission</div><h1>${esc(l.title)}</h1>${q?`<div class="passage"><strong>Let's revisit the question</strong><p>${esc(q.q)}</p><div class="small">${esc(q.e)}</div>${domain==='listening'?'<button class="btn" id="replayMistake">▶ Replay audio</button>':`<p>${esc(q.t)}</p>`}</div>`:''}<div class="lesson-tip"><div class="tip-avatar" aria-hidden="true">🦉</div><div><h3>Remember this!</h3><p>${esc(l.rule)}</p><p><strong>Example:</strong> ${esc(l.example)}</p></div></div><h2>Now it's your turn!</h2><p>${esc(l.prompt)}</p><div id="reviewOptions">${l.options.map((o,i)=>`<button class="choice" data-review-answer="${i}">${esc(o)}</button>`).join('')}</div><div id="reviewFeedback" aria-live="polite"></div><div class="actions"><button class="btn" id="backToJournal">← Back to journal</button></div><p class="small">${demo?'Free practice: does not change review scheduling or your CEFR estimate.':immediate?'Immediate correction helps you understand; spaced reviews will check retention later.':'This review does not change your estimated CEFR level.'}</p></section>`);document.getElementById('backToJournal').onclick=()=>nav('journal');if(q&&domain==='listening')document.getElementById('replayMistake').onclick=()=>{if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q.t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}};document.querySelectorAll('[data-review-answer]').forEach(b=>b.onclick=()=>{const chosen=Number(b.dataset.reviewAnswer),ok=chosen===l.correct,feedback=document.getElementById('reviewFeedback');document.querySelectorAll('[data-review-answer]').forEach(c=>{c.disabled=true;if(Number(c.dataset.reviewAnswer)===l.correct)c.classList.add('correct');else if(c===b)c.classList.add('wrong')});if(!demo){const r=state.journal[id];if(ok){if(!immediate&&Date.now()>=r.due){r.stage=Math.min(4,r.stage+1);r.mastered=r.stage>=4;r.due=r.mastered?null:Date.now()+SPACING[r.stage-1]*DAY}else if(immediate){r.due=Date.now()+DAY}}else{r.stage=0;r.mastered=false;r.due=Date.now()+DAY;r.errors++}r.last=Date.now();save()}feedback.innerHTML=`<div class="answer"><strong>${ok?'🌟 Well spotted!':'🌱 Let’s grow from this.'}</strong><p>${esc(l.why)}</p><p>${demo?'This was a practice example.':ok?'Good work! Keep coming back on the suggested review dates.':'Review the reminder and try another example later.'}</p><button class="btn primary" id="finishLesson">Back to my journal →</button></div>`;document.getElementById('finishLesson').onclick=()=>nav('journal')})}

function render(){if(page==='home')home();else if(page==='passport')passport();else if(page==='journal')journal();else rewards()};render();
</script><script src="cozy.js"></script><script src="arcade.js"></script></body></html>
